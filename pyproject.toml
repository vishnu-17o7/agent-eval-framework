[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval"
version = "0.1.0"
description = "Agent Evaluation Framework — multi-layer evaluation for AI agents"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "streamlit>=1.30.0",
    "sqlite-utils>=3.36",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
include = ["agent_eval*"]
